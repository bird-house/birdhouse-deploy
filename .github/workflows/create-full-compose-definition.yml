name: "Create Full Docker Compose Definition"

on:
  push:
    branches:
      - master
    paths:
      - 'birdhouse/components/*/default.env'
      - 'birdhouse/optional-components/*/default.env'

permissions:
  contents: read

jobs:
  tag:
    name: Create Docker Compose Definition
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Generate GitHub App token
        id: token_generator
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.BIRDHOUSE_HELPER_BOT_ID }}
          private-key: ${{ secrets.BIRDHOUSE_HELPER_BOT_KEY }}
          permission-contents: write

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          token: ${{ steps.token_generator.outputs.token }}
          fetch-depth: 2

      - name: Import GPG Key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.BIRDHOUSE_HELPER_BOT_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.BIRDHOUSE_HELPER_BOT_GPG_PRIVATE_KEY_PASSWORD }}
          git_user_signingkey: true
          git_tag_gpgsign: true
          trust_level: 5

      - name: Update files
        id: update-files
        run: |
          ./birdhouse/scripts/create-docker-compose-files-for-dependabot.sh
          changed_files="$(git ls-files -mo --exclude-standard -- ./.dependabot | cut -d/ -f 3 | paste -d + -s)"
          echo update=\'$changed_files\' >> "$GITHUB_OUTPUT"
          test -n "${changed_files}"
          echo continue="$?" >> "$GITHUB_OUTPUT"

      - name: Create PR
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        if: steps.update-files.outputs.continue == 0
        with:
          token: ${{ steps.token_generator.outputs.token }}
          commit-message: regenerate docker compose images lockfiles
          sign-commits: true
          branch: dependabot-full-compose-update-for-${{ steps.update-files.outputs.updated }}
          title: update dependabot updates for ${{ steps.update-files.outputs.updated }}
          body: |
            Automatic update to default docker image definitions.
            These files are used by dependabot to keep docker images up to date.

            This PR was triggered by changes made by merging ${{ github.sha }} to the master branch.
